[package]
name = "yt-tui"
version = "0.1.0"
edition = "2021"
description = "YouTube Music in the terminal — a polished media-player TUI"
license = "MIT"
repository = "https://github.com/francoisegner/yt-tui"
readme = "README.md"
keywords = ["youtube", "music", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "yt-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-input = "0.11"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
ringbuf = "0.4"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = "4"
color-thief = "0.2"
sha1 = "0.10"
hex = "0.4"
webbrowser = "1"
souvlaki = "0.8"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.8"
fuzzy-matcher = "0.3"
lru = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
url = "2"
base64 = "0.22"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
pretty_assertions = "1"

# Dev: our crate builds unoptimized (fast incremental rebuilds), while dependencies
# (audio decoding, FFT, image scaling) are optimized once and cached so playback is smooth.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Local release: parallel codegen + incremental so `--release` rebuilds take seconds.
[profile.release]
incremental = true
codegen-units = 16
lto = false
debug = false

# Distribution binaries (cargo-dist / `cargo build --profile dist`): slow but smallest/fastest.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = true
