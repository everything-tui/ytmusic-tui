[package]
name = "yt-tui"
version = "0.1.0"
edition = "2021"
description = "YouTube Music in the terminal — a polished media-player TUI"
license = "MIT"
repository = "https://github.com/francoisegner/yt-tui"
readme = "README.md"
keywords = ["youtube", "music", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "yt-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-input = "0.11"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
ringbuf = "0.4"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "4", default-features = false }
color-thief = "0.2"
sha1 = "0.10"
hex = "0.4"
webbrowser = "1"
souvlaki = "0.8"
# Runs the vendored yt-dlp EJS solver to decipher WEB_REMIX stream URLs.
rquickjs = "0.14"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.8"
fuzzy-matcher = "0.3"
lru = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
url = "2"
base64 = "0.22"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
pretty_assertions = "1"

# Dev: keep our crate unoptimized for fast rebuilds; only optimize the hot
# audio / FFT / image path so playback and cover art stay smooth while iterating.
[profile.dev.package.rodio]
opt-level = 3
debug = false
[profile.dev.package.cpal]
opt-level = 3
debug = false
[profile.dev.package.dasp_sample]
opt-level = 3
debug = false
[profile.dev.package.coreaudio-rs]
opt-level = 3
debug = false
[profile.dev.package.symphonia]
opt-level = 3
debug = false
[profile.dev.package.symphonia-core]
opt-level = 3
debug = false
[profile.dev.package.symphonia-metadata]
opt-level = 3
debug = false
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
debug = false
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
debug = false
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
debug = false
[profile.dev.package.rquickjs-sys]
opt-level = 3
debug = false
[profile.dev.package.rustfft]
opt-level = 3
debug = false
[profile.dev.package.primal-check]
opt-level = 3
debug = false
[profile.dev.package.strength_reduce]
opt-level = 3
debug = false
[profile.dev.package.transpose]
opt-level = 3
debug = false
[profile.dev.package.num-complex]
opt-level = 3
debug = false
[profile.dev.package.image]
opt-level = 3
debug = false
[profile.dev.package.image-webp]
opt-level = 3
debug = false
[profile.dev.package.png]
opt-level = 3
debug = false
[profile.dev.package.zune-jpeg]
opt-level = 3
debug = false
[profile.dev.package.zune-core]
opt-level = 3
debug = false

# Local release: parallel codegen; no incremental cache (saves hundreds of MB).
[profile.release]
incremental = false
codegen-units = 16
lto = false
debug = false

# Distribution binaries (cargo-dist / `cargo build --profile dist`): slow but smallest/fastest.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = true
